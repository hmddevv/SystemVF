name: Build

# Chạy trên mọi nhánh và mọi pull request: bằng chứng chất lượng không được phụ thuộc
# vào việc một máy cá nhân có bật Docker hay không.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test và kiểm tra kiến trúc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Biên dịch ở mức Java 21 (pom), chạy trên JDK 21 để giống môi trường triển khai.
      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runner của GitHub luôn có Docker, nên Testcontainers dựng được PostgreSQL 17 thật:
      # migration Flyway, ràng buộc CHECK/UNIQUE và JPQL đều được kiểm chứng như production.
      - name: mvnw verify (unit + integration + ArchUnit + coverage)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Đặc tả API được commit trong repo. Nếu code đổi mà file không đổi theo, OpenApiContractIT
      # đã ghi đè file ở bước trên -> ở đây cây làm việc bẩn, nghĩa là có thay đổi hợp đồng
      # chưa được commit.
      - name: Hợp đồng API phải khớp với đặc tả đã commit
        run: git diff --exit-code docs/openapi.json

      - name: Lưu báo cáo test và coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14
