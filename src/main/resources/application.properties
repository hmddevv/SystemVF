spring.application.name=farm-management

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:farm_management}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema do Flyway quan ly; Hibernate chi kiem tra entity khop voi schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# RFC 9457 ProblemDetail cho loi cua Spring MVC
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Mui gio nghiep vu: "hom nay" tinh theo gio Viet Nam
farm.time-zone=Asia/Ho_Chi_Minh
# MVP chua co xac thuc: chu so huu lay tu header X-User-Id, mac dinh la user 1
farm.identity.default-user-id=1
