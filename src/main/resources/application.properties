spring.application.name=farm-management

# Khong khai bao profile nao -> chay nhu moi truong phat trien.
# Trien khai that: dat SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Schema do Flyway quan ly; Hibernate chi kiem tra entity khop voi schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# RFC 9457 ProblemDetail cho loi cua Spring MVC
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# /actuator/health: dau vao cho healthcheck cua Docker Compose (M7)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Mui gio nghiep vu: "hom nay" tinh theo gio Viet Nam
farm.time-zone=Asia/Ho_Chi_Minh
# MVP chua co xac thuc: chu so huu lay tu header X-User-Id, mac dinh la user 1
farm.identity.default-user-id=1
