# Moi truong phat trien: PostgreSQL chay bang Docker Compose o cong 5433.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:farm_management}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Them dong ho demo: hai tai khoan chu nong trai de thu API va kiem tra BR-11.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Xem duoc trang thai tung thanh phan khi phat trien
management.endpoint.health.show-details=always
