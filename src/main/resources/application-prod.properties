# Trien khai that: moi thong tin ket noi lay tu bien moi truong, KHONG co gia tri mac dinh.
# Thieu bien nao thi ung dung dung ngay luc khoi dong, thay vi am tham noi vao database sai.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Chi migration cau truc va du lieu tham chieu. Khong co tai khoan demo nao.
spring.flyway.locations=classpath:db/migration

# Tai lieu API la be mat tan cong: mo ta san toan bo endpoint va quy tac nghiep vu.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Health endpoint chi tra UP/DOWN, khong lo chi tiet ha tang
management.endpoint.health.show-details=never

# Cho request dang xu ly chay xong roi moi tat (M7: rolling update khong lam mat du lieu)
server.shutdown=graceful
