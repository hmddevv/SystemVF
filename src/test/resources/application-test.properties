# Profile cua integration test. Datasource do Testcontainers cap qua @ServiceConnection,
# nen o day chi khai nhung gi test can khac voi production.

# Test can hai tai khoan demo de kiem chung viec co lap du lieu giua hai chu nong trai (BR-11).
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Mot lan chay test truoc M5 de ra 766KB log. Giu lai canh bao va loi, bo phan con lai.
logging.level.root=WARN
logging.level.com.hmdao.farm=INFO
logging.level.org.testcontainers=INFO
logging.level.org.flywaydb=WARN
spring.main.banner-mode=off
